# gitleaks configuration (Studio S8). `make scan-secrets` (and CI) scans every commit, merge commits included, with
# gitleaks' default rules plus the allow-lists below.
#
# Each allow-list names ONE rule, the files it covers and the exact shape of the flagged value, so a real key in the
# same file, or a finding of any other rule, is still reported. Every entry below matches findings of the first
# full-history scan (gitleaks 8.30.1, 2026-10-20: 24 findings, all rule generic-api-key), each checked by hand: none
# is a secret. Never allow-list a real key: rotate it, then remove it from the history. Merge commits are diffed
# against each parent (-m in the Makefile), so the same values are found again in the merge commits that brought
# them in: 42 findings over the 123 commits of 2026-10-20 (commit 0d3b606), all of them the values counted below.

[extend]
useDefault = true

# 20 findings: SHA-256 digests of committed eval files ("key_facts_sha256", "eval/rag_key_facts.jsonl") written into
# the results JSON by the eval scripts. A file checksum is not a credential. The regex is checked against the flagged
# match alone (`key_facts_sha256": "<digest>"`), not the whole line, so another key on the same line (a results JSON
# written on one line) is still reported.
[[allowlists]]
description = "SHA-256 digests of the key-facts file in results/*.json"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^results/.+\.json$''']
regexTarget = "match"
regexes = ['''^(?:rag_)?key_facts[a-z0-9_.]*": "[0-9a-f]{64}"$''']

# 2 findings: Docker BuildKit secret flags (`--secret id=CENSUS_API_KEY,env=CENSUS_API_KEY`). They name the
# environment variable that holds the key, never its value.
[[allowlists]]
description = "BuildKit --secret flags that name an environment variable"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^Dockerfile$''', '''^docs/deployment\.md$''']
regexes = ['''^env=[A-Z][A-Z0-9_]*$''']

# 1 finding: a React list key that names a simulation outcome field (p_stressed_dscr_at_least_min_year2).
[[allowlists]]
description = "Outcome field names used as React list keys"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^frontend/components/studio/project/path-panel\.tsx$''']
regexes = ['''^p_stressed_dscr_at_least_min_year2$''']

# 1 finding: prose in the build plan that lists which keys are Space secrets ("FRED/Census/BLS keys").
[[allowlists]]
description = "Prose list of key names in the Studio build plan"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/studio/founder_studio_build_prompts\.md$''']
regexes = ['''^FRED/Census/BLS$''']
